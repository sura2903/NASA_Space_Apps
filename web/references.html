<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SowSmart · Data sources and references</title>
  <meta name="description" content="The NASA datasets and other sources behind every number in SowSmart, with citations and links.">
  <meta name="ai-assistance" content="Code, analysis and text written with help from Anthropic Claude (Claude Code, a large language model) under the team's direction. No AI-generated data, images, audio or video on this site. Details: references.html#ai">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f7d32'/%3E%3Cpath d='M6 22c6-1 10-6 12-14 1 8 4 12 8 14' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="refs-page">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M6 22c6-1 10-6 12-14 1 8 4 12 8 14"/></svg>
      <div>
        <h1 data-i18n="brand">SowSmart</h1>
        <p class="tagline" data-i18n="tagline">Crop rotation choices for an uncertain monsoon, checked against NASA data</p>
      </div>
    </div>
    <div class="lang-wrap" role="group" aria-labelledby="lang-label">
      <span class="lang-label" id="lang-label" data-i18n="lang.label">Language</span>
      <button type="button" id="lang" class="lang-btn" lang="ta">Tamil / தமிழ்</button>
    </div>
    <nav class="tabs" aria-label="Views">
      <a class="tab" href="index.html"><span aria-hidden="true">🌾</span> <span data-i18n="tab.farm">Farmers</span></a>
      <a class="tab" href="policy.html"><span aria-hidden="true">🏛</span> <span data-i18n="tab.policy">Policy makers</span></a>
    </nav>
  </header>

  <main class="refs-main">
    <section class="panel refs-panel" id="refs-body" aria-live="polite"></section>
  </main>

  <script type="module">
    import { t, initLang, setLang, onLangChange, getLang } from "./js/i18n.js";
    import { renderReferences, refsUI } from "./js/ui/references.js";
    const body = document.getElementById("refs-body");
    const btn = document.getElementById("lang");
    function paint() {
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
      btn.textContent = t("lang.switch");
      btn.setAttribute("aria-label", t("lang.switch.aria"));
      btn.lang = getLang() === "ta" ? "en" : "ta";
      document.title = `${t("brand")} · ${refsUI("title")}`;
      renderReferences(body);
    }
    initLang();
    paint();
    btn.addEventListener("click", () => setLang(getLang() === "ta" ? "en" : "ta"));
    onLangChange(paint);
  </script>
</body>
</html>
